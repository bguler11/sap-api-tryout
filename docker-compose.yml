version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ntt-explorer-backend
    environment:
      - PORT=3001
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-ntt-api-explorer-default-32chr!}
      - NODE_ENV=production
    volumes:
      - ntt_explorer_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ntt-explorer-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ntt_explorer_data:
